name: jiaoyishuoflutter3
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_screenutil: 5.9.3
  logging: ^1.2.0
  flutter_redux: ^0.10.0
  redux: ^5.0.0
  # google_fonts: ^6.2.1
  vibration: ^2.0.1
  # qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  audioplayers: ^6.1.0
  # fullscreen_window: ^1.1.0
  # status_bar_control: ^3.2.1
  # video_player: ^2.9.1
  lottie: ^3.1.2
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  # flutter_native_splash: ^2.4.1
  # keyboard_height_plugin: ^0.1.5
  dotted_border: ^2.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2
  crypto: ^3.0.6
  get_thumbnail_video: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/images/
    - assets/images/avatar/
    - assets/images/avatar_webp/
    - assets/images/icon_webp/
    - assets/images/icon/
    - assets/images/ins/
    - assets/images/miniprogram_icon/
    - assets/sounds/
    - assets/lotties/
    - assets/web/
  fonts:
    - family: LJNFont
      fonts:
        - asset: ./assets/fonts/LJNFont.ttf
    - family: AlibabaPuHuiTi
      fonts:
        - asset: ./assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
    - family: AlibabaPuHuiTi-Medium
      fonts:
        - asset: ./assets/fonts/AlibabaPuHuiTi-3-65-Medium.ttf
    - family: NotoColorEmoji-Regular
      fonts:
        - asset: ./assets/fonts/NotoColorEmoji-Regular.ttf
    - family: Roboto-Regular
      fonts:
        - asset: ./assets/fonts/google_fonts/Roboto-Regular.ttf
    - family: Iconfont
      fonts:
        - asset: ./assets/fonts/iconfont/iconfont.ttf
