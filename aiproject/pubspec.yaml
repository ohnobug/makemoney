name: jiaoyishuoflutter3
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  logging: ^1.2.0
  vibration: ^3.1.2
  mobile_scanner: ^6.0.6
  lottie: ^3.1.2
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  dotted_border: ^2.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.3.0
  crypto: ^3.0.6
  get_thumbnail_video: ^0.7.3
  record: ^5.2.0
  uuid: ^3.0.6
  image_picker: ^1.0.4
  camera: ^0.11.0+2
  collection: ^1.19.0
  flutter_webrtc: ^0.12.11
  flutter_whip:
    path: G://mypkg/flutter-whip
  shared_preferences: ^2.5.2
  flutter_in_app_pip: ^1.7.4
  webview_windows: ^0.4.0
  window_manager: ^0.4.3
  video_player_win: ^3.1.1
  floating: ^5.0.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatar/
    - assets/images/avatar_webp/
    - assets/images/icon_webp/
    - assets/images/icon/
    - assets/images/ins/
    - assets/images/miniprogram_icon/
    - assets/sounds/
    - assets/lotties/
    - assets/web/
  fonts:
    - family: LJNFont
      fonts:
        - asset: ./assets/fonts/LJNFont.ttf
    - family: AlibabaPuHuiTi
      fonts:
        - asset: ./assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
    - family: AlibabaPuHuiTi-Medium
      fonts:
        - asset: ./assets/fonts/AlibabaPuHuiTi-3-65-Medium.ttf
    - family: NotoColorEmoji-Regular
      fonts:
        - asset: ./assets/fonts/NotoColorEmoji-Regular.ttf
    - family: Roboto-Regular
      fonts:
        - asset: ./assets/fonts/google_fonts/Roboto-Regular.ttf
    - family: Iconfont
      fonts:
        - asset: ./assets/fonts/iconfont/iconfont.ttf
