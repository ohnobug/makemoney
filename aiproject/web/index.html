<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="vigaviga" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>vigaviga</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!-- 
    We replaced the original <script src="flutter_bootstrap.js" async></script> 
    with a manual initialization process to gain more control.
  -->

    <!-- Step 1: Load the Flutter engine script. -->
    <script src="flutter.js" defer></script>

    <!-- Step 2: Add our custom initialization script. -->
    <script>
      window.addEventListener("load", function (ev) {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function (engineInitializer) {
            // Step 3: Initialize the Flutter engine.
            engineInitializer
              .initializeEngine({
                // This is the crucial part for your request.
                // We specify the URL from where CanvasKit assets should be loaded.

                // ==================== IMPORTANT ====================
                // Replace the URL below with the actual path where you have hosted
                // your CanvasKit files (canvaskit.js, canvaskit.wasm).
                // This can be a relative path (e.g., "/canvaskit/") if you host them
                // on the same server, or a full URL if you use a CDN.
                //
                // The URL MUST end with a forward slash "/".
                // ===================================================
                canvasKitBaseUrl: "/canvaskit/",
              })
              .then(function (appRunner) {
                // Step 4: The engine is ready, now run the Flutter app.
                appRunner.runApp();
              });
          },
        });
      });
    </script>
  </body>
</html>
