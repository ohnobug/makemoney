name: jiaoyishuoflutter3
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_screenutil: 5.9.3
  logging: ^1.2.0
  flutter_redux: ^0.10.0
  redux: ^5.0.0
  # google_fonts: ^6.2.1
  vibration: ^1.8.4
  # qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  audioplayers: ^6.1.0
  # fullscreen_window: ^1.1.0
  # status_bar_control: ^3.2.1
  video_player: ^2.9.1
  # flutter_native_splash: ^2.4.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter:
  uses-material-design: false
  assets:
    - assets/images/
    - assets/images/avatar/
    - assets/images/avatar_webp/
    - assets/images/icon_webp/
    - assets/images/icon/
    - assets/sounds/
    - assets/lotties/
  fonts:
    - family: SourceHanSans
      fonts:
        - asset: ./assets/fonts/SourceHanSans-VF.ttf.ttc
    - family: notosanssc
      fonts:
        - asset: ./assets/fonts/notosanssc.ttf
    - family: Iconfont
      fonts:
        - asset: ./assets/fonts/iconfont/iconfont.ttf